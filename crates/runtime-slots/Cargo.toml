[package]
name = "pillow-runtime-slots"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-side runtime-slot orchestration and Windows user-scoped secret storage"

[dependencies]
keeper-process-executor = { path = "../process-executor" }
keeper-project = { path = "../kernel-project" }
keeper-storage-sqlite = { path = "../storage-sqlite" }
serde.workspace = true
thiserror.workspace = true
toml = "0.9.12"
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3"
