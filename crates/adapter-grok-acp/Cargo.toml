[package]
name = "keeper-adapter-grok-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded Grok Build ACP adapter over NDJSON JSON-RPC stdio"

[[bin]]
name = "fake_acp_agent"
path = "src/bin/fake_acp_agent/main.rs"
required-features = []

[dependencies]
chrono.workspace = true
keeper-agent-protocol = { path = "../agent-protocol" }
keeper-governance-port = { path = "../governance-port" }
keeper-process-executor = { path = "../process-executor" }
keeper-runtime-host = { path = "../runtime-host" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
keeper-agent-protocol = { path = "../agent-protocol" }
keeper-policy = { path = "../kernel-policy" }
keeper-project = { path = "../kernel-project" }
keeper-session = { path = "../kernel-session" }
keeper-storage-sqlite = { path = "../storage-sqlite" }
tempfile = "3"
