[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/adapter-grok-acp",
  "crates/agent-protocol",
  "crates/git-executor",
  "crates/governance-port",
  "crates/kernel-policy",
  "crates/kernel-project",
  "crates/kernel-resource",
  "crates/kernel-session",
  "crates/knowledge-indexer",
  "crates/process-executor",
  "crates/runtime-host",
  "crates/runtime-slots",
  "crates/storage-sqlite",
  "crates/tool-executor",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
