[package]
name = "keeper-ide-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "keeper_ide_desktop"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "keeper-ide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
keeper-agent-protocol = { path = "../../../crates/agent-protocol" }
keeper-project = { path = "../../../crates/kernel-project" }
keeper-runtime-host = { path = "../../../crates/runtime-host" }
keeper-session = { path = "../../../crates/kernel-session" }
keeper-storage-sqlite = { path = "../../../crates/storage-sqlite" }
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
